<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1600" viewBox="0 0 1740 1600"><title>Lesson 13 setting sources, instructions and hook evidence sequence</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#087fff"/></marker></defs><rect width="1740" height="1600" rx="22" fill="#f4f9ff"/><text x="40" y="52" font-family="Arial" font-size="34" font-weight="bold" fill="#101a44">Select sources → load context → observe markers and actual hook traces</text><rect x="20" y="90" width="300" height="80" rx="16" fill="#087fff"/><text x="170" y="139" text-anchor="middle" font-family="Arial" font-size="27" font-weight="bold" fill="white">Student UI</text><path d="M170 170 V1550" stroke="#aec6df" stroke-dasharray="8 7"/><rect x="370" y="90" width="300" height="80" rx="16" fill="#8838ff"/><text x="520" y="139" text-anchor="middle" font-family="Arial" font-size="27" font-weight="bold" fill="white">Node host</text><path d="M520 170 V1550" stroke="#aec6df" stroke-dasharray="8 7"/><rect x="720" y="90" width="300" height="80" rx="16" fill="#00a977"/><text x="870" y="139" text-anchor="middle" font-family="Arial" font-size="27" font-weight="bold" fill="white">SDK + Claude</text><path d="M870 170 V1550" stroke="#aec6df" stroke-dasharray="8 7"/><rect x="1070" y="90" width="300" height="80" rx="16" fill="#8838ff"/><text x="1220" y="139" text-anchor="middle" font-family="Arial" font-size="27" font-weight="bold" fill="white">Hook / Read</text><path d="M1220 170 V1550" stroke="#aec6df" stroke-dasharray="8 7"/><rect x="1420" y="90" width="300" height="80" rx="16" fill="#ee5425"/><text x="1570" y="139" text-anchor="middle" font-family="Arial" font-size="27" font-weight="bold" fill="white">Private files</text><path d="M1570 170 V1550" stroke="#aec6df" stroke-dasharray="8 7"/><text x="180" y="227" fill="#142d53" font-family="Arial" font-size="24">1. Validate source mode and classroom ID</text><path d="M170 245 H520" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="530" y="325" fill="#142d53" font-family="Arial" font-size="24">2. Resolve owned cwd, home and config paths</text><path d="M520 343 H1570" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="530" y="423" fill="#142d53" font-family="Arial" font-size="24">3. Prepare non-conflicting instruction fixtures</text><path d="M520 441 H1570" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="530" y="521" fill="#142d53" font-family="Arial" font-size="24">4. Choose explicit sources or omission</text><path d="M520 539 H870" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="530" y="619" fill="#142d53" font-family="Arial" font-size="24">5. Leave the property absent when omitted</text><path d="M520 637 H870" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="530" y="717" fill="#142d53" font-family="Arial" font-size="24">6. Configure memory and private context separately</text><path d="M520 735 H870" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="530" y="815" fill="#142d53" font-family="Arial" font-size="24">7. Start the same real task with selected options</text><path d="M520 833 H870" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="880" y="913" fill="#142d53" font-family="Arial" font-size="24">8. Run the loaded filesystem command hook</text><path d="M870 931 H1220" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="530" y="1011" fill="#142d53" font-family="Arial" font-size="24">9. Run the explicit programmatic callback</text><path d="M870 1029 H520" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="530" y="1109" fill="#142d53" font-family="Arial" font-size="24">10. Block tool reads of instruction files</text><path d="M520 1127 H1220" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="530" y="1207" fill="#142d53" font-family="Arial" font-size="24">11. Preserve the actual typed result</text><path d="M870 1225 H520" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="530" y="1305" fill="#142d53" font-family="Arial" font-size="24">12. Read the private filesystem trace</text><path d="M1220 1323 H520" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="180" y="1403" fill="#142d53" font-family="Arial" font-size="24">13. Format and compare independent observations</text><path d="M520 1421 H170" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/></svg>